<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Naval听力" />
    <title>Naval 英语听力</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=20260523-waveform" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">30 天专项</p>
          <h1>Naval 英语听力</h1>
        </div>
        <button class="icon-button" id="installHelpButton" aria-label="安装提示">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m0 0 4-4m-4 4-4-4" />
            <path d="M5 14v4a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-4" />
          </svg>
        </button>
      </header>

      <main>
        <section class="view active" id="todayView" aria-labelledby="todayTitle">
          <div class="summary-band">
            <div>
              <p class="eyebrow">今日课程</p>
              <h2 id="todayTitle">第 <span id="currentDayNumber">1</span> 天</h2>
              <p id="todaySubtitle" class="muted"></p>
            </div>
          </div>

          <div class="dashboard-cards" id="dashboardCards" aria-label="听感仪表盘"></div>

          <div class="session-control" aria-label="学习时长">
            <button class="chip active" data-session="10">10 分钟</button>
            <button class="chip" data-session="15">15 分钟</button>
            <button class="chip" data-session="5">轻量 5 分钟</button>
          </div>

          <article class="lesson-panel" id="lessonPanel"></article>
        </section>

        <section class="view" id="courseView" aria-labelledby="courseTitle">
          <div class="section-heading">
            <p class="eyebrow">课程目录</p>
            <h2 id="courseTitle">30 天 Naval 专项</h2>
          </div>
          <div class="lesson-list" id="lessonList"></div>
        </section>

        <section class="view" id="pasteView" aria-labelledby="pasteTitle">
          <div class="section-heading">
            <p class="eyebrow">视频材料</p>
            <h2 id="pasteTitle">视频链接与字幕</h2>
          </div>

          <div class="link-workflow" aria-label="视频链接学习">
            <label>
              <span>视频链接</span>
              <input id="videoUrl" type="url" inputmode="url" placeholder="粘贴 YouTube、访谈或英文新闻视频链接" />
            </label>
            <div class="action-row">
              <button class="primary" id="copyDoubaoVideoPromptButton">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h10v10H8z" /><path d="M6 16H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>
                复制给豆包
              </button>
              <button class="secondary" id="copyCodexVideoPromptButton">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" /></svg>
                复制给 Codex
              </button>
            </div>
            <p class="helper-text">适合你看到喜欢的视频时使用。复制后发给豆包或我，我会把它整理成听力课。</p>
          </div>

          <div class="input-stack">
            <label>
              <span>标题</span>
              <input id="clipTitle" type="text" placeholder="例如：Naval on wealth and judgment" />
            </label>
            <label>
              <span>英文字幕或文章片段</span>
              <textarea id="clipText" rows="10" placeholder="把英文字幕、访谈文字或豆包整理后的英文材料粘贴到这里。"></textarea>
            </label>
          </div>

          <div class="action-row">
            <button class="primary" id="buildClipButton">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg>
              生成学习卡
            </button>
            <button class="secondary" id="copyDoubaoPromptButton">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h10v10H8z" /><path d="M6 16H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>
              复制给豆包
            </button>
          </div>

          <article class="clip-output" id="clipOutput" aria-live="polite"></article>
        </section>

        <section class="view" id="phraseView" aria-labelledby="phraseTitle">
          <div class="section-heading">
            <p class="eyebrow">语块本</p>
            <h2 id="phraseTitle">我的高价值表达</h2>
          </div>

          <form class="phrase-form" id="phraseForm">
            <input id="customPhrase" type="text" placeholder="英文表达" />
            <input id="customMeaning" type="text" placeholder="中文意思" />
            <button class="primary compact" type="submit">保存</button>
          </form>

          <div class="phrase-list" id="phraseList"></div>
        </section>

        <section class="view" id="reviewView" aria-labelledby="reviewTitle">
          <div class="section-heading">
            <p class="eyebrow">复习</p>
            <h2 id="reviewTitle">把语块听成直觉</h2>
          </div>
          <div class="review-panel" id="reviewPanel"></div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="nav-item active" data-view="todayView">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          <span>今日</span>
        </button>
        <button class="nav-item" data-view="courseView">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
          <span>目录</span>
        </button>
        <button class="nav-item" data-view="pasteView">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8l2 2v14H6V6z" /><path d="M9 12h6M9 16h6" /></svg>
          <span>粘贴</span>
        </button>
        <button class="nav-item" data-view="phraseView">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16l-7-3-7 3z" /></svg>
          <span>语块</span>
        </button>
        <button class="nav-item" data-view="reviewView">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 4v6h-6" /></svg>
          <span>复习</span>
        </button>
      </nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog id="installDialog">
      <div class="dialog-inner">
        <h2>放到 iPhone 主屏幕</h2>
        <p>用 Safari 打开这个页面，点底部分享按钮，再点"添加到主屏幕"。以后就像 App 一样打开。</p>
        <button class="primary" id="closeInstallDialog">知道了</button>
      </div>
    </dialog>

    <dialog id="recordingDialog" class="recording-dialog">
      <div class="dialog-inner">
        <h2>对照你的发声</h2>
        <p class="muted">蓝色是你刚才录的波形，橙色是原文音节节奏带。重点不在词不达意，在<strong>节奏和停顿</strong>是否对得上。</p>
        <p class="recording-target">原文：<span id="recordingTargetText"></span></p>
        <canvas id="waveformCanvas" width="640" height="200" class="waveform-canvas"></canvas>
        <audio id="recordingUserAudio" controls preload="auto"></audio>
        <div class="recording-controls">
          <button class="secondary" id="recordingReplayButton">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            回放我
          </button>
          <button class="secondary" id="recordingPlayOriginalButton">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            听原文
          </button>
          <button class="primary" id="recordingSatisfyButton" data-target-text="">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4 4L19 7" /></svg>
            这条满意
          </button>
          <button class="ghost" id="recordingCloseButton">关闭</button>
        </div>
      </div>
    </dialog>

    <script src="app.js?v=20260523-waveform" defer></script>
  </body>
</html>
